---
# Day-2 node operations through the k3s role.
#   make run PLAY=ops/k3s-day2 LIMIT=worker-1 EXTRA="-e action=drain"
#   actions: drain | uncordon | rotate-certs | fetch-kubeconfig | uninstall
#   fetch-kubeconfig: LIMIT=cp-1, writes k3s_kubeconfig_local_dest on this machine
- name: K3s day-2 action
  hosts: k3s_cluster
  become: true
  pre_tasks:
    - name: Require an action and a limit
      ansible.builtin.assert:
        that:
          - action is defined
          - ansible_limit is defined
        fail_msg: "pass -e action=<drain|uncordon|rotate-certs|fetch-kubeconfig|uninstall> and LIMIT=<host>"
  roles:
    - role: ahmz1833.server_setup.k3s
      vars:
        k3s_state: "{{ action }}"
