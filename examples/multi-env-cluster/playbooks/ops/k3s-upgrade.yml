---
# Rolling k3s upgrade. First bump k3s_version in group_vars/k3s_cluster (that's the IaC
# change), then:  make run PLAY=ops/k3s-upgrade ENV=staging   → verify → ENV=prod
- name: Upgrade control plane one by one
  hosts: k3s_servers
  become: true
  serial: 1
  roles:
    - role: ahmz1833.server_setup.k3s

- name: Upgrade workers, one at a time
  hosts: k3s_agents
  become: true
  serial: 1
  roles:
    - role: ahmz1833.server_setup.k3s
