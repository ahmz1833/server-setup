---
# Two axes: FUNCTION groups (what a host does) and LOCATION groups (where it is).
# A host can be in several function groups.
all:
  children:
    # --- function ---
    edge:              # public websites: acme + nginx(+WAF) + docker apps
      hosts:
        edge-1:
        edge-2:
    proxy:             # outbound proxy / relay (gost, sing-box)
      hosts:
        relay-1:
    sandbox:           # per-user SSH-into-container sandboxes
      hosts:
        lab-1:
    monitoring:        # Prometheus + Grafana as containers
      hosts:
        mon-1:
    # --- location ---
    loc_iran:          # Iranian network: mirrors, restricted internet helpers
      hosts:
        edge-2:
        relay-1:
    loc_abroad:
      hosts:
        edge-1:
        lab-1:
        mon-1:
