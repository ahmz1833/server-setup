---
- name: Initiate ACME DNS-01 challenge locally
  community.crypto.acme_certificate:
    account_key_src: "{{ acme_local_workspace }}/account.key"
    account_email: "{{ acme_account_email }}"
    src: "{{ acme_local_cert_dir }}/domain.csr"
    cert: "{{ acme_local_cert_dir }}/cert.pem"
    challenge: dns-01
    acme_directory: "{{ acme_directory_url }}"
    acme_version: 2
    terms_agreed: true
    modify_account: false
  register: acme_challenge
  delegate_to: localhost
  become: false

- name: Set DNS-01 provider
  ansible.builtin.set_fact:
    _acme_dns_provider: "{{ acme_cert_item.dns_provider | default(acme_dns_provider) }}"
    _acme_dns_records: >-
      {{ (acme_challenge.challenge_data | default({})).values()
         | map(attribute='dns-01') | list }}

- name: Create DNS-01 records on Cloudflare
  when:
    - acme_challenge is changed
    - _acme_dns_provider == 'cloudflare'
  block:
    - name: Add Cloudflare TXT records
      community.general.cloudflare_dns:
        api_token: "{{ acme_cloudflare_api_token }}"
        zone: "{{ acme_cert_item.zone | default(acme_cloudflare_zone, true) | default(acme_current_cn.split('.')[-2:] | join('.'), true) }}"
        record: "{{ item.record }}"
        type: TXT
        value: "{{ item.resource_value }}"
        ttl: 120
        state: present
      loop: "{{ _acme_dns_records }}"
      loop_control:
        label: "{{ item.record }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Wait for TXT records to propagate
      ansible.builtin.uri:
        url: "https://cloudflare-dns.com/dns-query?name={{ item.record }}&type=TXT"
        headers:
          Accept: application/dns-json
        return_content: true
      register: _acme_dns_check
      until: >-
        (_acme_dns_check.json.Answer | default([]) | map(attribute='data')
         | map('regex_replace', '"', '') | list) is contains(item.resource_value)
      retries: "{{ (acme_dns_propagation_timeout | int / 5) | int }}"
      delay: 5
      loop: "{{ _acme_dns_records }}"
      loop_control:
        label: "{{ item.record }}"
      delegate_to: localhost
      become: false

- name: Prompt for DNS and validate    # noqa: no-handler
  when: acme_challenge is changed
  block:
    - name: Refuse DNS-01 in non-interactive mode
      ansible.builtin.fail:
        msg: >-
          DNS-01 needs manual TXT records (or external automation). This role does
          not create DNS records. Set acme_noninteractive false for interactive
          mode, use challenge http-01 with a reachable webroot, or issue certs
          another way in CI.
      when:
        - acme_noninteractive | default(false) | bool
        - _acme_dns_provider != 'cloudflare'

    - name: Prompt for manual DNS TXT record creation
      ansible.builtin.pause:
        prompt: |
          ╔══════════════════════════════════════════════════════════════════╗

          ║                    DNS-01 CHALLENGE                              ║

          ╚══════════════════════════════════════════════════════════════════╝

          Domain: {{ acme_current_cn }}
          {% if acme_current_all_domains | length > 1 %}

          SANs:   {{ acme_current_all_domains[1:] | join(', ') }}
          {% endif %}

          Please create the following DNS TXT record(s):

          {% for k, v in acme_challenge.challenge_data.items() %}
          Name: {{ v['dns-01'].record }}

          Value: {{ v['dns-01'].resource_value }}

          {% endfor %}

          Verify propagation (one per record):
          {% for k, v in acme_challenge.challenge_data.items() %}
          dig TXT {{ v['dns-01'].record }}
          {% endfor %}

          Press ENTER when all records have propagated globally.
      when:
        - acme_challenge.challenge_data is defined
        - not (acme_noninteractive | default(false) | bool)
        - _acme_dns_provider != 'cloudflare'
      delegate_to: localhost
      become: false

    - name: Validate ACME challenge and fetch certificates
      community.crypto.acme_certificate:
        account_key_src: "{{ acme_local_workspace }}/account.key"
        account_email: "{{ acme_account_email }}"
        src: "{{ acme_local_cert_dir }}/domain.csr"
        cert: "{{ acme_local_cert_dir }}/cert.pem"
        fullchain: "{{ acme_local_cert_dir }}/fullchain.pem"
        challenge: dns-01
        acme_directory: "{{ acme_directory_url }}"
        acme_version: 2
        terms_agreed: true
        modify_account: false
        data: "{{ acme_challenge }}"
      delegate_to: localhost
      become: false
  always:
    - name: Remove Cloudflare TXT records
      community.general.cloudflare_dns:
        api_token: "{{ acme_cloudflare_api_token }}"
        zone: "{{ acme_cert_item.zone | default(acme_cloudflare_zone, true) | default(acme_current_cn.split('.')[-2:] | join('.'), true) }}"
        record: "{{ item.record }}"
        type: TXT
        value: "{{ item.resource_value }}"
        state: absent
      loop: "{{ _acme_dns_records }}"
      loop_control:
        label: "{{ item.record }}"
      when: _acme_dns_provider == 'cloudflare'
      delegate_to: localhost
      become: false
      no_log: true
