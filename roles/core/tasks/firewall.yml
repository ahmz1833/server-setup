# core/tasks/firewall.yml
---
- name: Install iptables persistence (Debian)
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install iptables persistence (RedHat)
  ansible.builtin.package:
    name: iptables-services
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

# =============================================================================
# IPv4 HOST-FIREWALL Chain
# =============================================================================
- name: "IPv4: Ensure HOST-FIREWALL chain exists"
  ansible.builtin.command: iptables -N HOST-FIREWALL
  register: _core_iptables_chain_v4
  failed_when: false
  changed_when: _core_iptables_chain_v4.rc == 0

- name: "IPv4: Flush HOST-FIREWALL chain"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    flush: true

- name: "IPv4: Allow loopback"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    in_interface: lo
    jump: ACCEPT
    comment: "loopback"

- name: "IPv4: Allow established connections"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    comment: "established"

- name: "IPv4: Drop invalid packets"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    ctstate: INVALID
    jump: DROP
    comment: "invalid"
  when: core_firewall_block_scans

- name: "IPv4: Drop TCP scan packets"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    protocol: tcp
    tcp_flags:
      flags: "{{ item.flags }}"
      flags_set: "{{ item.set }}"
    jump: DROP
    comment: "{{ item.comment }}"
  loop:
    - { flags: [FIN, SYN, RST, PSH, ACK, URG], set: [NONE], comment: "tcp-null" }
    - { flags: [FIN, SYN, RST, PSH, ACK, URG], set: [FIN, SYN, RST, PSH, ACK, URG], comment: "tcp-xmas" }
    - { flags: [SYN, FIN], set: [SYN, FIN], comment: "syn-fin" }
  when: core_firewall_block_scans

- name: "IPv4: Allow ICMP ping"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    protocol: icmp
    icmp_type: echo-request
    limit: 5/second
    limit_burst: 10
    jump: ACCEPT
    comment: "ping"
  when: core_firewall_allow_ping
  become: true

- name: "IPv4: Allow SSH"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    protocol: tcp
    destination_port: "{{ core_ssh_port }}"
    source: "{{ core_firewall_ssh_src }}"
    jump: ACCEPT
    comment: "ssh"

- name: "IPv4: Apply custom rules"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    protocol: "{{ item.proto if item.proto is defined else ('tcp' if item.port is defined else omit) }}"
    destination_port: "{{ item.port | default(omit) }}"
    source: "{{ item.src | default('0.0.0.0/0') }}"
    in_interface: "{{ item.in_interface | default(omit) }}"
    jump: ACCEPT
    comment: "{{ item.comment | default('custom') }}"
  loop: "{{ core_firewall_rules | rejectattr('ipset', 'defined') | rejectattr('v6_only', 'defined') | list }}"
  when: item.port is not defined or (item.port | string) != (core_ssh_port | string)

- name: "IPv4: Apply ipset-based rules"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    protocol: "{{ item.proto | default('tcp') }}"
    destination_port: "{{ item.port | default(omit) }}"
    match_set: "{{ item.ipset }}"
    match_set_flags: src
    jump: ACCEPT
    comment: "{{ item.comment | default(item.ipset) }}"
  loop: "{{ core_firewall_rules | selectattr('ipset', 'defined') | rejectattr('v6_only', 'defined') | list }}"

- name: "IPv4: Set default policy in HOST-FIREWALL"
  ansible.builtin.iptables:
    chain: HOST-FIREWALL
    jump: "{{ core_firewall_default_policy }}"

# =============================================================================
# IPv6 HOST-FIREWALL Chain (when enabled)
# =============================================================================
- name: Configure IPv6 firewall
  when: core_enable_ipv6
  become: true
  block:
    - name: "IPv6: Ensure HOST-FIREWALL chain exists"
      ansible.builtin.command: ip6tables -N HOST-FIREWALL
      register: _core_iptables_chain_v6
      failed_when: false
      changed_when: _core_iptables_chain_v6.rc == 0

    - name: "IPv6: Flush HOST-FIREWALL chain"
      ansible.builtin.iptables:
        chain: HOST-FIREWALL
        flush: true
        ip_version: ipv6

    - name: "IPv6: Allow loopback"
      ansible.builtin.iptables:
        chain: HOST-FIREWALL
        in_interface: lo
        jump: ACCEPT
        ip_version: ipv6
        comment: "loopback"

    - name: "IPv6: Allow established connections"
      ansible.builtin.iptables:
        chain: HOST-FIREWALL
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        ip_version: ipv6
        comment: "established"

    - name: "IPv6: Allow essential ICMPv6"
      ansible.builtin.iptables:
        chain: HOST-FIREWALL
        protocol: ipv6-icmp
        jump: ACCEPT
        ip_version: ipv6
        comment: "icmpv6"

    - name: "IPv6: Allow SSH"
      ansible.builtin.iptables:
        chain: HOST-FIREWALL
        protocol: tcp
        destination_port: "{{ core_ssh_port }}"
        source: "{{ core_firewall_ssh_src_v6 }}"
        jump: ACCEPT
        ip_version: ipv6
        comment: "ssh"

    - name: "IPv6: Apply custom rules"
      ansible.builtin.iptables:
        chain: HOST-FIREWALL
        protocol: "{{ item.proto if item.proto is defined else ('tcp' if item.port is defined else omit) }}"
        destination_port: "{{ item.port | default(omit) }}"
        source: "{{ item.src_v6 | default('::/0') }}"
        in_interface: "{{ item.in_interface | default(omit) }}"
        jump: ACCEPT
        ip_version: ipv6
        comment: "{{ item.comment | default('custom') }}"
      loop: "{{ core_firewall_rules | rejectattr('ipset', 'defined') | rejectattr('v4_only', 'defined') | list }}"
      when:
        - item.port is not defined or (item.port | string) != (core_ssh_port | string)
        - item.src is not defined or item.src_v6 is defined

    - name: "IPv6: Set default policy in HOST-FIREWALL"
      ansible.builtin.iptables:
        chain: HOST-FIREWALL
        jump: "{{ core_firewall_default_policy }}"
        ip_version: ipv6

# =============================================================================
# Save ONLY HOST-FIREWALL rules (excluding dynamic K3s/CNI/Docker chains)
# =============================================================================
- name: Save HOST-FIREWALL rules ONLY
  ansible.builtin.shell: |
    set -eo pipefail
    cat << 'EOF' > {{ item.dest }}
    # Generated by Ansible (core firewall role): ONLY HOST-FIREWALL persistence
    *filter
    :INPUT ACCEPT [0:0]
    :FORWARD ACCEPT [0:0]
    :OUTPUT ACCEPT [0:0]
    :HOST-FIREWALL - [0:0]
    -A INPUT -j HOST-FIREWALL
    EOF
    {{ item.cmd }} -t filter | grep -E '^-A HOST-FIREWALL ' >> {{ item.dest }} || true
    echo "COMMIT" >> {{ item.dest }}
  args:
    executable: /bin/bash
  changed_when: false
  loop:
    - cmd: 'iptables-save'
      dest: "{{ '/etc/iptables/rules.v4' if ansible_facts['os_family'] == 'Debian' else '/etc/sysconfig/iptables' }}"
    - cmd: 'ip6tables-save'
      dest: "{{ '/etc/iptables/rules.v6' if ansible_facts['os_family'] == 'Debian' else '/etc/sysconfig/ip6tables' }}"
      enabled: "{{ core_enable_ipv6 | default(false) | bool }}"
  when: item.enabled is not defined or (item.enabled | bool)

- name: Enable iptables service (RedHat)
  ansible.builtin.systemd:
    name: iptables
    state: started
    enabled: true
  when: ansible_facts['os_family'] == 'RedHat'

# =============================================================================
# Continuous Enforcement Daemon (Guarantees HOST-FIREWALL at index 1 of INPUT)
# =============================================================================
- name: Render script to continuously enforce HOST-FIREWALL at index 1 of INPUT chain
  ansible.builtin.template:
    src: host-firewall-enforce.sh.j2
    dest: /usr/local/bin/host-firewall-enforce.sh
    mode: "0755"
    owner: root
    group: root
  notify: Restart host-firewall-enforce

- name: Render systemd service to continuously enforce HOST-FIREWALL
  ansible.builtin.template:
    src: host-firewall-enforce.service.j2
    dest: /etc/systemd/system/host-firewall-enforce.service
    mode: "0644"
    owner: root
    group: root
  notify:
    - Reload systemd
    - Restart host-firewall-enforce

- name: Ensure host-firewall-enforce service is started and enabled
  ansible.builtin.systemd:
    name: host-firewall-enforce
    state: started
    enabled: true
    daemon_reload: true
  failed_when: false
