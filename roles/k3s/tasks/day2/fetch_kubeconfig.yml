---
- name: Retrieve cluster kubeconfig from primary server
  when: inventory_hostname == _k3s_primary_node
  block:
    - name: Slurp /etc/rancher/k3s/k3s.yaml
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: _k3s_raw_kubeconfig

    - name: Compute external endpoint host for kubeconfig
      ansible.builtin.set_fact:
        _k3s_kubeconfig_server: "{{ _k3s_api_server_url }}"

    - name: Process kubeconfig content safely
      ansible.builtin.set_fact:
        _k3s_processed_kubeconfig: >-
          {%- set kc = _k3s_raw_kubeconfig.content | b64decode | from_yaml -%}
          {%- set target_cluster = k3s_cluster_name | default('k3s', true) -%}
          {%- set _ = kc.clusters[0].cluster.update({'server': _k3s_kubeconfig_server}) -%}
          {%- if target_cluster != 'default' -%}
            {%- set _ = kc.clusters[0].update({'name': target_cluster}) -%}
            {%- set _ = kc.contexts[0].update({'name': target_cluster}) -%}
            {%- set _ = kc.contexts[0].context.update({'cluster': target_cluster}) -%}
            {%- set _ = kc.update({'current-context': target_cluster}) -%}
          {%- endif -%}
          {{ kc | to_nice_yaml(indent=2) }}

    - name: Ensure local destination directory exists
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_local_dest | expanduser | dirname }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Write kubeconfig to local workstation
      ansible.builtin.copy:
        content: "{{ _k3s_processed_kubeconfig }}"
        dest: "{{ k3s_kubeconfig_local_dest | expanduser }}"
        mode: "{{ k3s_kubeconfig_mode | default('0600') }}"
      delegate_to: localhost
      become: false
