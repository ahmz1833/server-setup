---
- name: Resolve and validate cluster token for secondary server
  ansible.builtin.include_tasks: resolve_token.yml

- name: Update config.yaml with resolved server join parameters
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
    owner: root
    group: root

- name: Ensure secondary K3s server is started and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for secondary K3s API server readiness
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ k3s_https_listen_port }}/readyz"
    validate_certs: false
    status_code:
      - 200
      - 401
  register: _k3s_sec_readyz
  until: _k3s_sec_readyz.status in [200, 401]
  retries: 30
  delay: 5
