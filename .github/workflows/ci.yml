name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build, examples, skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.16,<2.20" ansible-lint yamllint pyyaml passlib jmespath

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint roles
        run: ansible-lint --offline roles

      - name: Role code and argument specs are consistent
        run: scripts/check-consistency.py

      - name: Generated files and copies are up to date
        run: scripts/sync.sh --check

      - name: Skills frontmatter and plugin manifests
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          import yaml

          errors = []
          for skill in sorted(Path("skills").glob("*/SKILL.md")):
              text = skill.read_text()
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  errors.append(f"{skill}: missing frontmatter"); continue
              meta = yaml.safe_load(m.group(1))
              if meta.get("name") != skill.parent.name:
                  errors.append(f"{skill}: name must equal directory name")
              if not meta.get("description") or len(meta["description"]) > 1024:
                  errors.append(f"{skill}: description missing or > 1024 chars")
          galaxy = yaml.safe_load(Path("galaxy.yml").read_text())
          version = galaxy["version"]
          if len(galaxy.get("tags", [])) > 20:
              errors.append(f"galaxy.yml has {len(galaxy['tags'])} tags; Galaxy allows at most 20")
          plugin = json.loads(Path(".claude-plugin/plugin.json").read_text())
          market = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          if plugin["version"] != version:
              errors.append("plugin.json version != galaxy.yml version")
          if any(p.get("version") != version for p in market["plugins"]):
              errors.append("marketplace.json plugin version != galaxy.yml version")
          print("\n".join(errors) or "skills and manifests ok")
          sys.exit(1 if errors else 0)
          PY

      - name: Build collection artifact
        run: |
          rm -rf dist
          ansible-galaxy collection build --force --output-path dist

      - name: Install built collection and render role docs
        run: |
          install_path="${RUNNER_TEMP}/collection-install"
          mkdir -p "$install_path"
          artifact="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$artifact"
          ansible-galaxy collection install "$artifact" -p "$install_path"
          for role in roles/*/; do
            ANSIBLE_COLLECTIONS_PATH="$install_path:$HOME/.ansible/collections" \
              ansible-doc -t role "ahmz1833.server_setup.$(basename "$role")" > /dev/null
          done

      - name: Example projects (vault, syntax, argument specs, lint)
        run: scripts/test-examples.sh

  docker:
    name: Runner image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t server-setup:ci .
      - name: Smoke test
        run: |
          docker run --rm server-setup:ci sh -c \
            'ansible --version && ansible-doc -t role ahmz1833.server_setup.core >/dev/null && make --version >/dev/null'
